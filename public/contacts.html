<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Контакты - КиноДиплом</title>
    <link rel="icon" type="image/png" href="/cinema_12223.png">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .contacts-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 40px; 
            margin: 50px auto; 
            max-width: 1000px; 
        }
        
        .contact-info, .contact-form-container {
            background: var(--surface-color);
            padding: 30px;
            border-radius: 15px;
        }

        .contact-info h2, .contact-form-container h2 { 
            color: var(--primary-color); 
            margin-bottom: 20px; 
        }

        .info-item { margin-bottom: 20px; }
        .info-item h4 { color: var(--text-main); margin-bottom: 5px; }
        .info-item p { color: var(--text-muted); }

        /* Стили формы */
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; color: var(--text-muted); margin-bottom: 5px; font-size: 0.9rem; }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 5px;
            color: white;
            font-family: inherit;
        }
        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .btn-send {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-weight: 600;
            transition: 0.3s;
        }
        .btn-send:hover { background: var(--primary-hover); }

        /* Карта */
        .map-container {
            margin-top: 40px;
            border-radius: 15px;
            overflow: hidden;
            height: 300px;
            background: #2a2a2a;
        }

        @media (max-width: 768px) {
            .contacts-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container header-content">
            <div class="logo" onclick="window.location.href='/'">🎬 ЭН-СИ</div>
            <div class="header-right">
                <button class="btn-login" onclick="window.location.href='/'">На главную</button>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="contacts-grid">
            <div class="contact-info">
                <h2>Наши контакты</h2>
                <div class="info-item">
                    <h4>📍 Адрес</h4>
                    <p>г. Краснодар, ул. Седина, 42</p>
                </div>
                <div class="info-item">
                    <h4>📞 Телефон</h4>
                    <p>+7 (495) 123-45-67</p>
                </div>
                <div class="info-item">
                    <h4>✉️ Email</h4>
                    <p>support@kinodiplom.ru</p>
                </div>
                <div class="info-item">
                    <h4>⏰ Режим работы</h4>
                    <p>Ежедневно: 10:00 — 22:00</p>
                </div>
            </div>

            <div class="contact-form-container">
                <h2>Напишите нам</h2>
                <form id="contactForm">
                    <div class="form-group">
                        <label>Ваше имя</label>
                        <input type="text" id="name" placeholder="Иван Иванов" required>
                    </div>
                    <div class="form-group">
                        <label>Ваш Email</label>
                        <input type="email" id="email" placeholder="example@mail.ru" required>
                    </div>
                    <div class="form-group">
                        <label>Сообщение</label>
                        <textarea id="message" rows="4" placeholder="Введите ваш вопрос..." required></textarea>
                    </div>
                    <button type="submit" class="btn-send">Отправить сообщение</button>
                </form>
                <div id="formStatus" style="margin-top: 15px; text-align: center;"></div>
            </div>
        </div>

        <div class="map-container">
            <iframe 
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2245.275591325164!2d37.5366403159306!3d55.75363028055106!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x46b54a50b3156273%3A0x76adad02294f9b23!2z0JzQvtGB0LrQstCwLdCh0LjRgtC4!5e0!3m2!1sru!2sru!4v1650000000000!5m2!1sru!2sru" 
                width="100%" height="100%" style="border:0; filter: grayscale(1) invert(0.9);" allowfullscreen="" loading="lazy">
            </iframe>
        </div>
    </main>

    <script>
        document.getElementById('contactForm').addEventListener('submit', async function(e) {
          e.preventDefault();
    
          const status = document.getElementById('formStatus');
          const btn = this.querySelector('.btn-send');
    
          // Собираем данные
          const formData = {
          name: document.getElementById('name').value,
          email: document.getElementById('email').value,
          message: document.getElementById('message').value
          };

          // Визуальная индикация загрузки
          status.style.color = 'var(--primary-color)';
          status.textContent = 'Отправка...';
          btn.disabled = true;

          try {
          const response = await fetch('/api/contacts', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(formData)
         });

          const result = await response.json();

          if (response.ok) {
            status.style.color = '#4caf50';
            status.textContent = result.message;
            this.reset(); // Очищаем форму
         } else {
            throw new Error(result.error || 'Ошибка при отправке');
         }
         } catch (err) {
            status.style.color = '#ff4d4d';
            status.textContent = 'Произошла ошибка: ' + err.message;
        } finally {
            btn.disabled = false;
        }
    });
    </script>
</body>
</html>
