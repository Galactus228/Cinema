<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой профиль - КиноДиплом</title>
    <link rel="icon" type="image/png" href="/cinema_12223.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .profile-container { padding: 40px 0; }
        .profile-card { background-color: var(--surface-color); padding: 40px; border-radius: 10px; max-width: 800px; margin: 0 auto; text-align: center; }
        .profile-card-header { display: flex; flex-direction: column; align-items: center; gap: 20px; margin-bottom: 30px; }
        .profile-avatar-large { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 4px solid var(--primary-color); }
        .profile-name { font-size: 2rem; color: var(--text-main); }
        .profile-email { color: var(--text-muted); }
        .profile-section { margin-top: 40px; text-align: left; }
        .profile-section h3 { font-size: 1.5rem; color: var(--primary-color); border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 20px; }
        .ticket-history-placeholder { color: var(--text-muted); }
        .profile-avatar-large { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 4px solid var(--primary-color); }
        .profile-upload-section { margin-top: 20px; text-align: center; } /* text-align: center на родительском элементе */
        .profile-upload-section input[type="file"] { display: none; }
        .btn-upload-avatar {
            background-color: var(--primary-color); color: white; border: none; padding: 10px 20px;
            border-radius: 5px; cursor: pointer; transition: 0.3s; margin-top: 10px;
            /* --- ИЗМЕНЕНИЯ ЗДЕСЬ --- */
            display: block; /* Убедимся, что он блочный */
            width: fit-content; /* Занимает только необходимую ширину */
            margin: 10px auto 0 auto; /* Центрируем по горизонтали, отступ сверху 10px */
            /* --- КОНЕЦ ИЗМЕНЕНИЙ --- */
        }
        .btn-upload-avatar:hover { background-color: var(--primary-hover); }
        .avatar-upload-label { cursor: pointer; color: var(--primary-color); text-decoration: underline; margin-top: 10px; display: inline-block; }
        .upload-message { color: var(--text-muted); margin-top: 10px; }
        .error-message { color: #ff4d4d; margin-top: 10px; }
        .tickets-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
        .ticket-card { background: #2a2a2a; border-left: 5px solid var(--primary-color); border-radius: 8px; padding: 20px; position: relative; overflow: hidden; transition: transform 0.2s; }
        .ticket-card:hover { transform: translateY(-5px); }
        .ticket-card::after { content: '🎬'; position: absolute; right: -10px; bottom: -10px; font-size: 4rem; opacity: 0.05; }
        .ticket-movie-title { font-weight: 700; font-size: 1.2rem; margin-bottom: 10px; color: var(--text-main); }
        .ticket-info { font-size: 0.9rem; color: var(--text-muted); line-height: 1.6; }
        .ticket-info b { color: var(--primary-color); }
        .ticket-date { display: block; margin-top: 10px; font-size: 0.85rem; background: rgba(255, 255, 255, 0.05); padding: 5px 10px; border-radius: 4px; width: fit-content; }
        /* Псевдо-кнопка для выбора файла */
        .avatar-upload-label {
           display: inline-block;
           background-color: transparent;
           color: var(--primary-color);
           border: 2px solid var(--primary-color);
           padding: 8px 18px;
           border-radius: 8px;
           cursor: pointer;
           font-weight: 600;
           font-size: 0.9rem;
           transition: all 0.3s ease;
           margin-bottom: 10px;
           text-decoration: none; /* Убираем подчеркивание */
        }

        .avatar-upload-label:hover {
           background-color: var(--primary-color);
           color: white;
           box-shadow: 0 4px 12px rgba(229, 9, 20, 0.2); /* Тень в цвет бренда */
        }

        /* Кнопка "Загрузить" (подтверждение) */
        .btn-upload-avatar {
           background-color: #28a745; /* Зеленая, чтобы отличалась от выбора */
           color: white;
           border: none;
           padding: 10px 20px;
           border-radius: 8px;
           cursor: pointer;
           font-weight: bold;
           transition: 0.3s;
           margin: 10px auto;
           display: none; /* Скрыта по умолчанию */
        }

        .btn-upload-avatar:hover {
           background-color: #218838;
           transform: scale(1.02);
        }
        .btn-refund {
    background-color: transparent;
    color: #ff4d4d;
    border: 1px solid #ff4d4d;
    padding: 6px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.8rem;
    margin-top: 15px;
    transition: all 0.3s;
    width: 100%; /* На всю ширину карточки билета */
}

.btn-refund:hover {
    background-color: #ff4d4d;
    color: white;
}
.modal-overlay {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(5px);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000;
}
.modal-content {
    background: #1a1a1a;
    padding: 30px;
    border-radius: 12px;
    border: 1px solid #333;
    text-align: center;
    max-width: 400px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}
.modal-content h3 { color: #007bff; margin-bottom: 15px; }
.modal-buttons { display: flex; gap: 15px; margin-top: 25px; justify-content: center; }

.btn-secondary { background: #333; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; }
.btn-refund-confirm { background: #ff4d4d; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <!-- HEADER -->
    <header class="header">
        <div class="container header-content">
            <div class="logo" onclick="window.location.href='/'">🎬 ЭН-СИ</div>
            <div class="header-right">
                <!-- Сюда auth.js вставит аватарку и кнопку "Выйти" -->
                <button class="btn-login" onclick="window.location.href='/'">Вернуться к афише</button> 
            </div>
        </div>
    </header>

    <main class="container">
        <div id="profile-content" class="profile-container">
            <!-- Сюда JS вставит данные профиля -->
            <p>Загрузка данных профиля...</p>
        </div>
    </main>
    
    <script src="/js/auth.js"></script>
    <script>
        // 1. Глобальные переменные (в самом верху скрипта)
    let ticketToRefund = null;

    function refundTicket(ticketId) {
        ticketToRefund = ticketId;
        document.getElementById('refund-modal').style.display = 'flex';
    }
        document.addEventListener('DOMContentLoaded', async () => {
            const profileContent = document.getElementById('profile-content');
            const token = localStorage.getItem('jwtToken');
            console.log("Отправляю токен:", token);
            if (!token) {
                window.location.href = '/';
                return;
            }
            document.getElementById('modal-cancel').onclick = () => {
            document.getElementById('refund-modal').style.display = 'none';
        };

        document.getElementById('modal-confirm').onclick = async () => {
            const token = localStorage.getItem('jwtToken');
            try {
                const res = await fetch(`/api/tickets/${ticketToRefund}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) location.reload();
                else alert('Ошибка возврата');
            } catch (err) { console.error(err); }
        };
            function formatTicketDate(dateString) {
              const date = new Date(dateString);
              return date.toLocaleString('ru-RU', {
              day: 'numeric',
              month: 'long',
              hour: '2-digit',
              minute: '2-digit'
            });
            }
            // Получаем данные профиля (уже обновленный API)
            try {
                const response = await fetch('/api/profile', {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }
                });
                const data = await response.json();

                if (data.statusCode === 401 || response.status === 401) {
                    console.error("Сервер отклонил токен");
                    // Временно закомментируй редирект, чтобы увидеть ошибку в консоли
                    // window.location.href = '/'; 
                    return;
                }
                if (!response.ok) { throw new Error(data.message || 'Ошибка авторизации'); }

                const userAvatarUrl = data.avatar_url || '/images/default-avatar.png';
                const userName = data.name;
                const userEmail = data.email;

                profileContent.innerHTML = `
                    <div class="profile-card">
                        <div class="profile-card-header">
                            <img src="${userAvatarUrl}" alt="Аватар" class="profile-avatar-large" id="profile-main-avatar">
                            <div class="profile-upload-section">
                                 <input type="file" id="avatar-upload" accept="image/jpeg,image/png,image/webp">
    
                                 <label for="avatar-upload" class="avatar-upload-label">
                                    📷 Выбрать новое фото
                                 </label>
    
                                 <div id="upload-status" class="upload-message" style="margin-bottom: 10px;"></div>
                                 <button id="upload-avatar-btn" class="btn-upload-avatar">Подтвердить обновление</button>
    
                                 <div id="upload-error" class="error-message"></div>
                            </div>
                            <div>
                                <h2 class="profile-name">${userName}</h2>
                                <p class="profile-email">${userEmail}</p>
                            </div>
                        </div>
                        <div class="profile-section">
                            <h3>Мои билеты</h3>
                            ${data.bookings.length > 0 
                                ? `<div class="tickets-list">
                                    ${data.bookings.map(ticket => `
                                        <div class="ticket-card">
                                            <div class="ticket-movie-title">${ticket.title}</div>
                                            <div class="ticket-info">
                                                Ряд: <b>${ticket.row_num}</b>, Место: <b>${ticket.seat_num}</b>
                                                <span class="ticket-date">📅 ${formatTicketDate(ticket.start_time)}</span>
                                            </div>
                                            <button class="btn-refund" onclick="refundTicket(${ticket.id})">Вернуть билет</button>
                                        </div>
                                    `).join('')}
                                  </div>` 
                                : '<p class="ticket-history-placeholder">У вас пока нет купленных билетов. <a href="/" style="color:var(--primary-color)">Купить первый?</a></p>'
                            }
                        </div>
                    </div>
                `;

                // --- Логика загрузки аватарки ---
                const avatarUploadInput = document.getElementById('avatar-upload');
                const uploadAvatarBtn = document.getElementById('upload-avatar-btn');
                const uploadStatus = document.getElementById('upload-status');
                const uploadError = document.getElementById('upload-error');
                const profileMainAvatar = document.getElementById('profile-main-avatar');

                let selectedFile = null;

                avatarUploadInput.addEventListener('change', (e) => {
                    selectedFile = e.target.files[0];
                    if (selectedFile) {
                        uploadStatus.textContent = `Выбран файл: ${selectedFile.name} (${(selectedFile.size / 1024 / 1024).toFixed(2)} MB)`;
                        uploadError.textContent = '';
                        uploadAvatarBtn.style.display = 'block'; // Показываем кнопку "Загрузить"
                    } else {
                        uploadStatus.textContent = '';
                        uploadAvatarBtn.style.display = 'none';
                    }
                });

                uploadAvatarBtn.addEventListener('click', async () => {
                    if (!selectedFile) {
                        uploadError.textContent = 'Выберите файл для загрузки.';
                        return;
                    }

                    uploadStatus.textContent = 'Загрузка...';
                    uploadError.textContent = '';
                    uploadAvatarBtn.disabled = true;

                    const formData = new FormData();
                    formData.append('avatar', selectedFile); // 'avatar' - это имя поля, которое ожидает сервер

                    try {
                        const uploadResponse = await fetch('/api/profile/avatar', {
                            method: 'POST',
                            headers: {
                                'Authorization': `Bearer ${token}`
                            },
                            body: formData // FormData сам выставляет Content-Type: multipart/form-data
                        });
                        const uploadData = await uploadResponse.json();

                        if (!uploadResponse.ok) {
                            throw new Error(uploadData.error || 'Ошибка загрузки файла');
                        }

                        // Успешная загрузка: обновляем аватарку, токен и localStorage
                        profileMainAvatar.src = uploadData.avatar_url;
                        localStorage.setItem('userAvatarUrl', uploadData.avatar_url);
                        localStorage.setItem('jwtToken', uploadData.token); // Сохраняем новый токен

                        uploadStatus.textContent = 'Аватар успешно обновлен!';
                        uploadAvatarBtn.style.display = 'none'; // Скрываем кнопку "Загрузить"
                        uploadAvatarBtn.disabled = false;
                        selectedFile = null;
                        avatarUploadInput.value = ''; // Очищаем input[file]
                        
                        // Также обновляем аватарку в шапке (если она уже загружена)
                        const headerAvatar = document.querySelector('.profile-avatar img');
                        if (headerAvatar) {
                            headerAvatar.src = uploadData.avatar_url;
                        }

                    } catch (err) {
                        uploadError.textContent = err.message || 'Ошибка загрузки.';
                        uploadStatus.textContent = '';
                        uploadAvatarBtn.disabled = false;
                    }
                });

                // Скрываем кнопку "Загрузить" по умолчанию
                uploadAvatarBtn.style.display = 'none';

            } catch (err) {
                console.error("Ошибка загрузки профиля:", err);
                profileContent.innerHTML = `
            <div class="profile-card">
                <p class="error-message">Не удалось загрузить данные профиля.</p>
                <button class="btn-upload-avatar" onclick="location.reload()">Попробовать снова</button>
            </div>
        `;
            }
        });
    </script>
    <div id="refund-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
        <h3>Подтверждение возврата</h3>
        <p id="modal-ticket-info">Вы действительно хотите вернуть этот билет?</p>
        <div class="modal-buttons">
            <button id="modal-cancel" class="btn-secondary">Отмена</button>
            <button id="modal-confirm" class="btn-refund-confirm">Да, вернуть</button>
        </div>
    </div>
</div>
</body>
</html>
