<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой профиль - КиноДиплом</title>
    <link rel="icon" type="image/png" href="/cinema_12223.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .profile-container {
            padding: 40px 0;
        }

        .profile-card {
            background-color: var(--surface-color);
            padding: 40px;
            border-radius: 10px;
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }

        .profile-card-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .profile-avatar-large {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--primary-color);
        }

        .profile-name {
            font-size: 2rem;
            color: var(--text-main);
        }

        .profile-email {
            color: var(--text-muted);
        }

        .profile-section {
            margin-top: 40px;
            text-align: left;
        }

        .profile-section h3 {
            font-size: 1.5rem;
            color: var(--primary-color);
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .ticket-history-placeholder {
            color: var(--text-muted);
        }

        .profile-avatar-large {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--primary-color);
        }

        .profile-upload-section {
            margin-top: 20px;
            text-align: center;
        }

        /* text-align: center на родительском элементе */
        .profile-upload-section input[type="file"] {
            display: none;
        }

        .btn-upload-avatar {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
            /* --- ИЗМЕНЕНИЯ ЗДЕСЬ --- */
            display: block;
            /* Убедимся, что он блочный */
            width: fit-content;
            /* Занимает только необходимую ширину */
            margin: 10px auto 0 auto;
            /* Центрируем по горизонтали, отступ сверху 10px */
            /* --- КОНЕЦ ИЗМЕНЕНИЙ --- */
        }

        .btn-upload-avatar:hover {
            background-color: var(--primary-hover);
        }

        .avatar-upload-label {
            cursor: pointer;
            color: var(--primary-color);
            text-decoration: underline;
            margin-top: 10px;
            display: inline-block;
        }

        .upload-message {
            color: var(--text-muted);
            margin-top: 10px;
        }

        .error-message {
            color: #ff4d4d;
            margin-top: 10px;
        }

        .tickets-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .ticket-card {
            background: #2a2a2a;
            border-left: 5px solid var(--primary-color);
            border-radius: 8px;
            padding: 20px;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s;
        }

        .ticket-card:hover {
            transform: translateY(-5px);
        }

        .ticket-card::after {
            content: '🎬';
            position: absolute;
            right: -10px;
            bottom: -10px;
            font-size: 4rem;
            opacity: 0.05;
        }

        .ticket-movie-title {
            font-weight: 700;
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: var(--text-main);
        }

        .ticket-info {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .ticket-info b {
            color: var(--primary-color);
        }

        .ticket-date {
            display: block;
            margin-top: 10px;
            font-size: 0.85rem;
            background: rgba(255, 255, 255, 0.05);
            padding: 5px 10px;
            border-radius: 4px;
            width: fit-content;
        }

        /* Псевдо-кнопка для выбора файла */
        .avatar-upload-label {
            display: inline-block;
            background-color: transparent;
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
            padding: 8px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            margin-bottom: 10px;
            text-decoration: none;
            /* Убираем подчеркивание */
        }

        .avatar-upload-label:hover {
            background-color: var(--primary-color);
            color: white;
            box-shadow: 0 4px 12px rgba(229, 9, 20, 0.2);
            /* Тень в цвет бренда */
        }

        /* Кнопка "Загрузить" (подтверждение) */
        .btn-upload-avatar {
            background-color: #28a745;
            /* Зеленая, чтобы отличалась от выбора */
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            margin: 10px auto;
            display: none;
            /* Скрыта по умолчанию */
        }

        .btn-upload-avatar:hover {
            background-color: #218838;
            transform: scale(1.02);
        }

        .btn-refund {
            background-color: transparent;
            color: #ff4d4d;
            border: 1px solid #ff4d4d;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            margin-top: 15px;
            transition: all 0.3s;
            width: 100%;
            /* На всю ширину карточки билета */
        }

        .btn-refund:hover {
            background-color: #ff4d4d;
            color: white;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-content {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #333;
            text-align: center;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .modal-content h3 {
            color: #007bff;
            margin-bottom: 15px;
        }

        .modal-buttons {
            display: flex;
            gap: 15px;
            margin-top: 25px;
            justify-content: center;
        }

        .btn-secondary {
            background: #333;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-refund-confirm {
            background: #ff4d4d;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        /* Контейнер для всей области слайдера */
        .tickets-slider-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
        }

        /* Окно, через которое мы видим билеты */
        .tickets-viewport {
            overflow: hidden;
            width: 100%;
            border-radius: 8px;
        }

        /* Сама лента с билетами */
        .tickets-list {
            display: flex;
            gap: 20px;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            padding: 10px 5px;
            /* чтобы тени не обрезались */
        }

        /* Фиксированная ширина карточки в слайдере */
        .ticket-card {
            min-width: 280px;
            max-width: 280px;
            background: #2a2a2a;
            border-left: 5px solid var(--primary-color);
            border-radius: 8px;
            padding: 20px;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s;
            flex-shrink: 0;
            /* чтобы карточки не сжимались */
        }

        /* Кнопки перелистывания */
        .slider-btn {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: 0.3s;
            z-index: 5;
            flex-shrink: 0;
        }

        .slider-btn:hover {
            background: var(--primary-color);
            box-shadow: 0 0 10px rgba(229, 9, 20, 0.5);
        }

        .slider-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* Прячем кнопки, если билетов мало */
        .hidden {
            display: none !important;
        }

        /* Стили для стандартного чека */
        .receipt-card {
            min-width: 200px;
            max-width: 200px;
            background: #ffffff;
            /* Белый фон */
            color: #000000;
            /* Черный текст */
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 15px;
            flex-shrink: 0;
            font-family: 'Courier New', Courier, monospace;
            /* Шрифты как на кассовом чеке */
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            text-align: left;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .receipt-card:hover {
            transform: scale(1.02);
        }

        .receipt-header {
            border-bottom: 1px dashed #000;
            padding-bottom: 5px;
            margin-bottom: 10px;
            font-weight: bold;
            font-size: 0.8rem;
        }

        .receipt-body {
            font-size: 0.75rem;
            line-height: 1.4;
        }

        .receipt-footer {
            border-top: 1px dashed #000;
            margin-top: 10px;
            padding-top: 5px;
            font-weight: bold;
            text-align: right;
        }

        /* Общий контейнер для секции чеков */
        .receipts-section {
            margin-top: 50px;
        }

        /* Кастомный скроллбар для области билетов и чеков, если нужно */
        .tickets-viewport::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>

<body>
    <!-- HEADER -->
    <header class="header">
        <div class="container header-content">
            <div class="logo" onclick="window.location.href='/'">🎬 ЭН-СИ</div>
            <div class="header-right">
                <!-- Сюда auth.js вставит аватарку и кнопку "Выйти" -->
                <button class="btn-login" onclick="window.location.href='/'">Вернуться к афише</button>
            </div>
        </div>
    </header>

    <main class="container">
        <div id="profile-content" class="profile-container">
            <!-- Сюда JS вставит данные профиля -->
            <p>Загрузка данных профиля...</p>
        </div>
    </main>

    <script src="/js/auth.js"></script>
    <script>
        // 1. Глобальные переменные (в самом верху скрипта)
        let ticketToRefund = null;

        function refundTicket(ticketId) {
            ticketToRefund = ticketId;
            document.getElementById('refund-modal').style.display = 'flex';
        }
        document.addEventListener('DOMContentLoaded', async () => {
            const profileContent = document.getElementById('profile-content');
            const token = localStorage.getItem('jwtToken');
            console.log("Отправляю токен:", token);
            if (!token) {
                window.location.href = '/';
                return;
            }
            document.getElementById('modal-cancel').onclick = () => {
                document.getElementById('refund-modal').style.display = 'none';
            };

            document.getElementById('modal-confirm').onclick = async () => {
                const token = localStorage.getItem('jwtToken');
                try {
                    const res = await fetch(`/api/tickets/${ticketToRefund}`, {
                        method: 'DELETE',
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });
                    if (res.ok) location.reload();
                    else alert('Ошибка возврата');
                } catch (err) {
                    console.error(err);
                }
            };

            function formatTicketDate(dateString) {
                const date = new Date(dateString);
                return date.toLocaleString('ru-RU', {
                    day: 'numeric',
                    month: 'long',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            }
            // Функция для открытия модального окна с билетом
            // Сделай функцию глобальной
            window.openTicketModal = function(ticketData) {
                const modal = document.getElementById('ticket-modal');
                const container = document.getElementById('ticket-container');

                // Если по какой-то причине modal не найден в DOM
                if (!modal) {
                    console.error("Модальное окно 'ticket-modal' не найдено!");
                    return;
                }

                container.innerHTML = `
        <div style="background-color: #1a1a1a; color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 40px; border-radius: 10px; max-width: 600px; margin: auto; border: 1px solid #333; text-align: left;">
            <h1 style="color: #007bff; border-bottom: 2px solid #007bff; padding-bottom: 10px; text-transform: uppercase; font-size: 24px; margin-top: 0;">
                🎬 Электронный билет
            </h1>
            <p style="font-size: 16px; margin-top: 20px;">
                Спасибо за покупку! Ждем вас в нашем кинотеатре.
            </p>
            <div style="background-color: #262626; padding: 20px; border-radius: 8px; margin-top: 20px; line-height: 1.6;">
                <p style="margin: 5px 0;"><strong style="color: #007bff;">Фильм:</strong> ${ticketData.title}</p>
                <p style="margin: 5px 0;"><strong style="color: #007bff;">Дата и время:</strong> ${new Date(ticketData.start_time).toLocaleString('ru-RU')}</p>
                <p style="margin: 5px 0;">
                    <strong style="color: #007bff;">Ряд:</strong> ${ticketData.row_num} | 
                    <strong style="color: #007bff;">Место:</strong> ${ticketData.seat_num}
                </p>
                <p style="margin: 5px 0;"><strong style="color: #007bff;">Стоимость:</strong> ${ticketData.price || '500'} руб.</p>
            </div>
            <div style="margin-top: 30px; padding: 15px; border: 1px dashed #555; text-align: center; color: #888; font-size: 14px;">
                Покажите это окно контроллеру при входе в зал.
            </div>
        </div>
    `;

                modal.style.display = 'flex';
            };

            // Обработчики закрытия модалки билета
            document.getElementById('close-ticket').onclick = () => {
                document.getElementById('ticket-modal').style.display = 'none';
            };

            window.addEventListener('click', (event) => {
                const modal = document.getElementById('ticket-modal');
                if (event.target === modal) {
                    modal.style.display = 'none';
                }
            });
            // Получаем данные профиля (уже обновленный API)
            try {
                const response = await fetch('/api/profile', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                const data = await response.json();

                if (data.statusCode === 401 || response.status === 401) {
                    console.error("Сервер отклонил токен");
                    // Временно закомментируй редирект, чтобы увидеть ошибку в консоли
                    // window.location.href = '/'; 
                    return;
                }
                if (!response.ok) {
                    throw new Error(data.message || 'Ошибка авторизации');
                }

                const userAvatarUrl = data.avatar_url || '/images/default-avatar.png';
                const userName = data.name;
                const userEmail = data.email;

                profileContent.innerHTML = `
    <div class="profile-card">
        <div class="profile-card-header">
            <!-- Аватарка -->
            <img src="${userAvatarUrl}" alt="Аватар" class="profile-avatar-large" id="profile-main-avatar">
            
            <!-- Имя и Почта прямо под аватаркой -->
            <div class="profile-info-text">
                <h2 class="profile-name">${userName}</h2>
                <p class="profile-email">${userEmail}</p>
            </div>

            <!-- Кнопка выбора фото теперь под текстом -->
            <div class="profile-upload-section">
                 <input type="file" id="avatar-upload" accept="image/jpeg,image/png,image/webp">

                 <label for="avatar-upload" class="avatar-upload-label">
                    📷 Сменить фото
                 </label>

                 <div id="upload-status" class="upload-message" style="margin-bottom: 10px;"></div>
                 <button id="upload-avatar-btn" class="btn-upload-avatar">Подтвердить обновление</button>
                 <div id="upload-error" class="error-message"></div>
            </div>
        </div>

        <div class="profile-section">
            <h3>Мои билеты</h3>
            ${data.bookings.length > 0 
                ? `<div class="tickets-slider-wrapper">
        <button class="slider-btn prev-btn" id="prevBtn" onclick="moveSlider(-1)">❮</button>
        
        <div class="tickets-viewport">
            <div class="tickets-list" id="ticketsList">
                ${data.bookings.map(ticket => {
                    const ticketJson = JSON.stringify(ticket).replace(/"/g, '&quot;');
                    return `
                    <div class="ticket-card" ondblclick="openTicketModal(${ticketJson})" style="cursor: pointer;">
                        <div class="ticket-movie-title">${ticket.title}</div>
                        <div class="ticket-info">
                            Ряд: <b>${ticket.row_num}</b>, Место: <b>${ticket.seat_num}</b>
                            <span class="ticket-date">📅 ${formatTicketDate(ticket.start_time)}</span>
                        </div>
                        <button class="btn-refund" onclick="event.stopPropagation(); refundTicket(${ticket.id})">Вернуть билет</button>
                    </div>`;
                }).join('')}
            </div>
        </div>

        <button class="slider-btn next-btn" id="nextBtn" onclick="moveSlider(1)">❯</button>
                  </div>` 
                : '<p class="ticket-history-placeholder">У вас пока нет купленных билетов. <a href="/" style="color:var(--primary-color)">Купить первый?</a></p>'
            }
        </div>
        <div class="profile-section" style="margin-top: 50px;">
            <h3>Мои чеки (платежи)</h3>
            ${data.payments && data.payments.length > 0 
                ? `<div class="tickets-slider-wrapper">
                    <button class="slider-btn" id="prevReceiptBtn" onclick="moveReceiptSlider(-1)">❮</button>
                    
                    <div class="tickets-viewport">
                        <div class="tickets-list" id="receiptsList">
                            ${data.payments.map(payment => {
                                const paymentJson = JSON.stringify(payment).replace(/"/g, '&quot;');
                                return `
                                <div class="receipt-card" ondblclick="openReceiptModal(${paymentJson})" style="cursor: pointer;">
                                    <div class="receipt-header">ЭЛЕКТРОННЫЙ ЧЕК</div>
                                    <div class="receipt-body">
                                        <b>ID:</b> #${payment.id}<br>
                                        <b>КАРТА:</b> **** ${payment.card_last_four}<br>
                                        <b>ДАТА:</b> ${new Date(payment.created_at).toLocaleDateString('ru-RU')}
                                    </div>
                                    <div class="receipt-footer">
                                        ${payment.amount} ₽
                                    </div>
                                </div>`;
                            }).join('')}
                        </div>
                    </div>

                    <button class="slider-btn" id="nextReceiptBtn" onclick="moveReceiptSlider(1)">❯</button>
                </div>`
                : '<p class="ticket-history-placeholder">У вас пока нет совершённых платежей.</p>'
            }
        </div>
    </div>
`;

                // --- Логика загрузки аватарки ---
                const avatarUploadInput = document.getElementById('avatar-upload');
                const uploadAvatarBtn = document.getElementById('upload-avatar-btn');
                const uploadStatus = document.getElementById('upload-status');
                const uploadError = document.getElementById('upload-error');
                const profileMainAvatar = document.getElementById('profile-main-avatar');

                let selectedFile = null;

                avatarUploadInput.addEventListener('change', (e) => {
                    selectedFile = e.target.files[0];
                    if (selectedFile) {
                        uploadStatus.textContent = `Выбран файл: ${selectedFile.name} (${(selectedFile.size / 1024 / 1024).toFixed(2)} MB)`;
                        uploadError.textContent = '';
                        uploadAvatarBtn.style.display = 'block'; // Показываем кнопку "Загрузить"
                    } else {
                        uploadStatus.textContent = '';
                        uploadAvatarBtn.style.display = 'none';
                    }
                });

                uploadAvatarBtn.addEventListener('click', async () => {
                    if (!selectedFile) {
                        uploadError.textContent = 'Выберите файл для загрузки.';
                        return;
                    }

                    uploadStatus.textContent = 'Загрузка...';
                    uploadError.textContent = '';
                    uploadAvatarBtn.disabled = true;

                    const formData = new FormData();
                    formData.append('avatar', selectedFile); // 'avatar' - это имя поля, которое ожидает сервер

                    try {
                        const uploadResponse = await fetch('/api/profile/avatar', {
                            method: 'POST',
                            headers: {
                                'Authorization': `Bearer ${token}`
                            },
                            body: formData // FormData сам выставляет Content-Type: multipart/form-data
                        });
                        const uploadData = await uploadResponse.json();

                        if (!uploadResponse.ok) {
                            throw new Error(uploadData.error || 'Ошибка загрузки файла');
                        }

                        // Успешная загрузка: обновляем аватарку, токен и localStorage
                        profileMainAvatar.src = uploadData.avatar_url;
                        localStorage.setItem('userAvatarUrl', uploadData.avatar_url);
                        localStorage.setItem('jwtToken', uploadData.token); // Сохраняем новый токен

                        uploadStatus.textContent = 'Аватар успешно обновлен!';
                        uploadAvatarBtn.style.display = 'none'; // Скрываем кнопку "Загрузить"
                        uploadAvatarBtn.disabled = false;
                        selectedFile = null;
                        avatarUploadInput.value = ''; // Очищаем input[file]

                        // Также обновляем аватарку в шапке (если она уже загружена)
                        const headerAvatar = document.querySelector('.profile-avatar img');
                        if (headerAvatar) {
                            headerAvatar.src = uploadData.avatar_url;
                        }

                    } catch (err) {
                        uploadError.textContent = err.message || 'Ошибка загрузки.';
                        uploadStatus.textContent = '';
                        uploadAvatarBtn.disabled = false;
                    }
                });

                // Скрываем кнопку "Загрузить" по умолчанию
                uploadAvatarBtn.style.display = 'none';

            } catch (err) {
                console.error("Ошибка загрузки профиля:", err);
                profileContent.innerHTML = `
            <div class="profile-card">
                <p class="error-message">Не удалось загрузить данные профиля.</p>
                <button class="btn-upload-avatar" onclick="location.reload()">Попробовать снова</button>
            </div>
        `;
            }
        });
        // Переменные для хранения позиции прокрутки (в самом начале скрипта)
        let ticketScroll = 0;
        let receiptScroll = 0;

        // Функция для билетов
        window.moveSlider = function(direction) {
            const list = document.getElementById('ticketsList');
            if (!list) return;

            const viewport = list.parentElement;
            const card = list.querySelector('.ticket-card');
            const step = card ? card.offsetWidth + 20 : 300;
            const maxScroll = list.scrollWidth - viewport.offsetWidth;

            ticketScroll += direction * step;
            if (ticketScroll < 0) ticketScroll = 0;
            if (ticketScroll > maxScroll) ticketScroll = maxScroll;

            list.style.transform = `translateX(-${ticketScroll}px)`;
        };

        // Функция для чеков (проверь, что ID в HTML совпадает с 'receiptsList')
        window.moveReceiptSlider = function(direction) {
            const list = document.getElementById('receiptsList');
            if (!list) return;

            const viewport = list.parentElement;
            const card = list.querySelector('.receipt-card');
            // Если карточка чека уже есть, берем её ширину, иначе стандарт 240
            const step = card ? card.offsetWidth + 20 : 240;
            const maxScroll = list.scrollWidth - viewport.offsetWidth;

            receiptScroll += direction * step;

            // Ограничители
            if (receiptScroll < 0) receiptScroll = 0;
            if (receiptScroll > maxScroll) receiptScroll = maxScroll;

            list.style.transform = `translateX(-${receiptScroll}px)`;
        };
        window.openReceiptModal = function(payment) {
            const modal = document.getElementById('ticket-modal');
            const container = document.getElementById('ticket-container');

            // Если по какой-то причине элементы не найдены
            if (!modal || !container) {
                console.error("Элементы модального окна не найдены");
                return;
            }

            // Формируем "бумажный" вид чека
            container.innerHTML = `
        <div style="background: #ffffff; color: #000000; padding: 30px; font-family: 'Courier New', Courier, monospace; max-width: 400px; margin: auto; border: 1px solid #000; box-shadow: 0 0 15px rgba(0,0,0,0.2); text-align: left;">
            <div style="text-align: center; border-bottom: 2px dashed #000; padding-bottom: 10px; margin-bottom: 15px;">
                <h2 style="margin: 0; font-size: 20px;">КИНOДИПЛОМ</h2>
                <div style="text-align: center; font-weight: bold; margin-bottom: 10px;">
                ФИЛЬМ: ${payment.movie_title}
                </div>
            </div>
            
            <div style="font-size: 14px; line-height: 1.6;">
                <p style="margin: 5px 0;"><b>ЧЕК №:</b> ${payment.id}</p>
                <p style="margin: 5px 0;"><b>ДАТА:</b> ${new Date(payment.created_at).toLocaleString('ru-RU')}</p>
                <p style="margin: 5px 0;"><b>КАРТА:</b> **** ${payment.card_last_four}</p>
                <p style="margin: 5px 0;"><b>ВЛАДЕЛЕЦ:</b> ${payment.card_holder || 'Клиент'}</p>
                <hr style="border: none; border-top: 1px dashed #000; margin: 15px 0;">
                <div style="display: flex; justify-content: space-between; font-weight: bold; font-size: 18px;">
                    <span>ИТОГО:</span>
                    <span>${payment.amount} ₽</span>
                </div>
            </div>

            <div style="margin-top: 30px; text-align: center; font-size: 11px; color: #555;">
                <p>ЭЛЕКТРОННЫЙ ДОКУМЕНТ</p>
                <p>ООО "КИНOДИПЛОМ"</p>
            </div>
        </div>
    `;

            modal.style.display = 'flex'; // Показываем модальное окно
        };
    </script>
    <div id="refund-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3>Подтверждение возврата</h3>
            <p id="modal-ticket-info">Вы действительно хотите вернуть этот билет?</p>
            <div class="modal-buttons">
                <button id="modal-cancel" class="btn-secondary">Отмена</button>
                <button id="modal-confirm" class="btn-refund-confirm">Да, вернуть</button>
            </div>
        </div>
    </div>
    <!-- Модальное окно для билета -->
    <div id="ticket-modal" class="modal" style="display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.8); align-items: center; justify-content: center;">
        <div class="modal-content" style="position: relative; width: 100%; max-width: 600px;">
            <span id="close-ticket" style="position: absolute; right: -30px; top: -30px; color: #fff; font-size: 30px; cursor: pointer;">&times;</span>
            <div id="ticket-container">
                <!-- Сюда вставится разметка из JS -->
            </div>
        </div>
    </div>
</body>

</html>
