<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Выбор мест - КиноДиплом</title>
    <link rel="icon" type="image/png" href="/cinema_12223.png">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .booking-container { max-width: 900px; margin: 50px auto; padding: 20px; background: var(--surface-color); border-radius: 15px; }
        .screen { width: 80%; height: 5px; background: #555; margin: 0 auto 50px; box-shadow: 0 10px 20px rgba(255,255,255,0.2); border-radius: 50%; text-align: center; color: #777; padding-top: 15px; font-size: 0.8rem; }
        
        .hall-layout { display: flex; flex-direction: column; gap: 10px; align-items: center; overflow-x: auto; padding: 20px; }
        .row { display: flex; gap: 8px; align-items: center; }
        .row-num { width: 30px; color: var(--text-muted); font-size: 0.8rem; }
        
        .seat { width: 35px; height: 35px; background: #333; border-radius: 6px 6px 12px 12px; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; }
        
        .hall-layout .seat.available { cursor: pointer; transition: 0.2s; color: transparent; }
        .hall-layout .seat.available:hover { background: var(--primary-color); color: white; transform: translateY(-2px); }
        .hall-layout .seat.taken { background: #ff4d4d; cursor: not-allowed; opacity: 0.8; color: white; border: none }
        .hall-layout .seat.selected { background: var(--primary-color); box-shadow: 0 0 15px var(--primary-color); color: white; }

        .legend { display: flex; justify-content: center; gap: 30px; margin: 30px 0; border-top: 1px solid #333; padding-top: 20px; }
        .legend-item { display: flex; align-items: center; gap: 10px; font-size: 0.9rem; color: var(--text-muted); }
        .legend .seat { cursor: default !important; pointer-events: none; }
        .legend .seat.available { background: #333; }
        .legend .seat.taken { background: #ff4d4d; opacity: 1; }
        .legend .seat.selected { background: var(--primary-color); }

        .btn-pay { display: block; width: 100%; max-width: 300px; margin: 20px auto; padding: 15px; font-size: 1.1rem; font-weight: 700; }

        /* Стили модального окна оплаты */
        .pay-modal-content { max-width: 400px; padding: 30px; }
        .card-form input { 
            width: 100%; padding: 12px; margin: 10px 0; 
            background: #1a1a1a; border: 1px solid #333; 
            color: #fff; border-radius: 8px; font-family: monospace; 
        }
        .card-row { display: flex; gap: 10px; }
        .total-display { text-align: center; margin-bottom: 20px; font-size: 1.1rem; color: var(--text-muted); }
        .total-display b { color: var(--primary-color); font-size: 1.6rem; }
    </style>
</head>
<body>
    <header class="header">
        <div class="container header-content">
            <div class="logo" onclick="window.location.href='/'" style="cursor:pointer;">🎬 КиноДиплом</div>
            <div class="header-right">
                <nav class="nav">
                    <div class="dropdown">
                        <span class="dropdown-trigger">Меню ▾</span>
                        <div class="dropdown-content">
                            <a href="/">Афиша</a>
                            <a href="/schedule">Расписание</a>
                            <a href="/coming-soon">Скоро в кино</a>
                            <a href="/news">Новости</a>
                            <a href="/promotions">Акции и скидки</a>
                            <a href="/about">О нас</a>
                        </div>
                    </div>
                </nav>
                <button class="btn-login">Войти в профиль</button>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="booking-container">
            <h1 id="movie-title" style="text-align: center; margin-bottom: 5px;">Загрузка...</h1>
            <p id="session-info" style="color: var(--text-muted); text-align: center; margin-bottom: 30px;"></p>

            <div class="screen">ЭКРАН</div>
            <div id="hall-layout" class="hall-layout"></div>

            <div class="legend">
                <div class="legend-item"><div class="seat available"></div><span>Свободно</span></div>
                <div class="legend-item"><div class="seat taken"></div><span>Занято</span></div>
                <div class="legend-item"><div class="seat selected"></div><span>Выбрано</span></div>
            </div>

            <div id="order-summary" style="text-align: center; margin-bottom: 20px; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px;">
                <p style="color: var(--text-muted);">Выбрано место:</p>
                <h3 id="seat-details" style="color: var(--primary-color);">Не выбрано</h3>
            </div>

            <button id="buy-btn" class="btn-primary btn-pay" disabled>Купить билет</button>
        </div>
    </div>

    <div id="payment-modal" class="modal-overlay">
        <div class="modal-content pay-modal-content">
            <span class="close-modal" id="close-pay-modal">&times;</span>
            <h2 style="text-align: center;">Оплата заказа</h2>
            <div class="total-display">Сумма к оплате: <br><b id="modal-amount">0</b> руб.</div>
            
            <form id="payment-form" class="card-form">
                <input type="text" id="card-num" placeholder="0000 0000 0000 0000" maxlength="19" required>
                <div class="card-row">
                    <input type="text" placeholder="ММ/ГГ" maxlength="5" required style="width: 60%">
                    <input type="password" placeholder="CVC" maxlength="3" required style="width: 40%">
                </div>
                <input type="text" placeholder="ИМЯ ВЛАДЕЛЬЦА" required>
                <div style="display: flex; gap: 10px; margin-top: 20px;">
    <button type="button" id="cancel-pay-btn" style="flex: 1; padding: 15px; background: #444; border: none; border-radius: 8px; color: white; cursor: pointer; font-weight: bold;">
        Отмена
    </button>
    
    <button type="submit" id="confirm-pay-btn" class="btn-primary" style="flex: 2; padding: 15px;">
        Оплатить билеты
    </button>
</div>
            </form>
        </div>
    </div>

    <div id="auth-modal" class="modal-overlay">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <div id="login-form-container">
                <h2>Вход</h2>
                <form id="login-form">
                    <input type="email" id="login-email" placeholder="Email" required>
                    <div class="password-wrapper">
                        <input type="password" id="login-password" placeholder="Пароль" required>
                        <span class="toggle-password" onclick="togglePasswordVisibility('login-password')">👁️</span>
                    </div>
                    <button type="submit" class="btn-primary">Войти</button>
                    <p class="auth-switch">Нет аккаунта? <a href="#" id="go-to-register">Зарегистрироваться</a></p>
                    <div id="login-error" class="error-msg"></div>
                </form>
            </div>
            <div id="register-form-container" style="display: none;">
                <h2>Регистрация</h2>
                <form id="register-form">
                    <input type="text" id="reg-name" placeholder="Имя" required>
                    <input type="email" id="reg-email" placeholder="Email" required>
                    <div class="password-wrapper">
                        <input type="password" id="reg-password" placeholder="Пароль" required>
                        <span class="toggle-password" onclick="togglePasswordVisibility('reg-password')">👁️</span>
                    </div>
                    <button type="submit" class="btn-primary">Создать аккаунт</button>
                    <p class="auth-switch">Уже есть аккаунт? <a href="#" id="go-to-login">Войти</a></p>
                    <div id="reg-error" class="error-msg"></div>
                </form>
            </div>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const sessionId = urlParams.get('sessionId');
        let selectedSeats = [];
        let sessionPrice = 0;

        function showNotification(text, type = 'success') {
            const old = document.querySelector('.toast');
            if(old) old.remove();
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = text;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }

        async function loadData() {
            if (!sessionId) { 
                document.getElementById('movie-title').textContent = "Сеанс не найден";
                return; 
            }
            try {
                const movieRes = await fetch(`/api/sessions/${sessionId}/movie`);
                const movieData = await movieRes.json();
                const movieTitle = movieData.title || "Выбор мест";
                // Загружаем места
                const res = await fetch(`/api/sessions/${sessionId}/seats`);
                const seats = await res.json();
                
                // Загружаем цену (через созданный ранее роут)
                const priceRes = await fetch(`/api/sessions/${sessionId}/price`);
                const priceData = await priceRes.json();
                sessionPrice = priceData.price || 0;
                
                document.getElementById('movie-title').textContent = movieTitle;
                document.getElementById('session-info').textContent = `Сеанс | Цена: ${sessionPrice} руб.`;

                const layout = document.getElementById('hall-layout');
                const rows = {};
                
                seats.forEach(s => {
                    if(!rows[s.row_num]) rows[s.row_num] = [];
                    rows[s.row_num].push(s);
                });

                layout.innerHTML = '';
                Object.keys(rows).forEach(rNum => {
                    const rowDiv = document.createElement('div');
                    rowDiv.className = 'row';
                    rowDiv.innerHTML = `<div class="row-num">${rNum}</div>`;
                    
                    rows[rNum].forEach(s => {
                        const sDiv = document.createElement('div');
                        sDiv.className = `seat ${s.is_taken > 0 ? 'taken' : 'available'}`;
                        sDiv.textContent = s.seat_num;
                        
                        if(s.is_taken === 0) {
                            sDiv.onclick = () => {
                                if (sDiv.classList.contains('selected')) {
                                    sDiv.classList.remove('selected');
                                    selectedSeats = selectedSeats.filter(item => item.id !== s.id);
                                } else {
                                    sDiv.classList.add('selected');
                                    selectedSeats.push(s);
                                }
                                
                                const detailsElement = document.getElementById('seat-details');
                                if (selectedSeats.length > 0) {
                                    detailsElement.innerHTML = selectedSeats
                                        .map(item => `Ряд ${item.row_num} (Место ${item.seat_num})`)
                                        .join(', ');
                                    document.getElementById('buy-btn').disabled = false;
                                } else {
                                    detailsElement.textContent = "Не выбрано";
                                    document.getElementById('buy-btn').disabled = true;
                                }
                            };
                        }
                        rowDiv.appendChild(sDiv);
                    });
                    layout.appendChild(rowDiv);
                });
            } catch (e) {
                document.getElementById('movie-title').textContent = "Ошибка загрузки";
            }
        }

        // Логика модального окна оплаты
const payModal = document.getElementById('payment-modal');

// Функция закрытия (используем в нескольких местах)
const closePayment = () => {
    payModal.style.display = 'none';
    document.getElementById('payment-form').reset();
};

document.getElementById('close-pay-modal').onclick = closePayment;
// Кнопка отмены внутри модалки
if (document.getElementById('cancel-pay-btn')) {
    document.getElementById('cancel-pay-btn').onclick = closePayment;
}

// Кнопка в основном интерфейсе: ОТКРЫТЬ ОПЛАТУ
document.getElementById('buy-btn').onclick = () => {
    const token = localStorage.getItem('jwtToken');
    if (!token) { 
        showNotification("Для покупки билета необходимо войти!", "error");
        if (typeof window.openAuthModal === 'function') window.openAuthModal();
        return; 
    }
    
    const total = selectedSeats.length * sessionPrice;
    document.getElementById('modal-amount').innerText = total;
    payModal.style.display = 'flex';
};

// Исправленная обработка масок (вынесена из вложенности)
document.getElementById('card-num').oninput = (e) => {
    e.target.value = e.target.value.replace(/\D/g, '').replace(/(.{4})/g, '$1 ').trim();
};

const dateInput = document.querySelector('input[placeholder="ММ/ГГ"]');
if (dateInput) {
    dateInput.oninput = (e) => {
        let v = e.target.value.replace(/\D/g, '').slice(0, 4);
        if (v.length >= 3) {
            v = v.slice(0, 2) + '/' + v.slice(2);
        }
        e.target.value = v;
    };
}

// ФОРМА ОПЛАТЫ (ФИНАЛЬНОЕ БРОНИРОВАНИЕ)
document.getElementById('payment-form').onsubmit = async (e) => {
    e.preventDefault();
    const token = localStorage.getItem('jwtToken');
    const btn = document.getElementById('confirm-pay-btn');
    
    btn.disabled = true;
    btn.innerText = 'Проверка платежа...';

    // Имитация задержки банка
    await new Promise(r => setTimeout(r, 1200));

    let successCount = 0;
    const seatsToBook = [...selectedSeats]; // Копируем массив

    // ЦИКЛ БРОНИРОВАНИЯ
    for (let seat of seatsToBook) {
        try {
            const res = await fetch('/api/book-ticket', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json', 
                    'Authorization': `Bearer ${token}` 
                },
                body: JSON.stringify({ 
                    session_id: sessionId, 
                    seat_id: seat.id 
                })
            });
            if (res.ok) successCount++;
        } catch (err) {
            console.error("Ошибка при бронировании места:", seat.id);
        }
    }

    if (successCount === seatsToBook.length) {
        showNotification(`Успешно! Куплено билетов: ${successCount}`, "success");
        
        closePayment();
        
        // Сброс состояния интерфейса
        selectedSeats = [];
        document.getElementById('buy-btn').disabled = true;
        document.getElementById('seat-details').textContent = "Не выбрано";
        
        // Обновляем зал
        loadData(); 

        btn.disabled = false;
        btn.innerText = 'Оплатить билеты';
    } else if (successCount > 0) {
        showNotification(`Ошибка: забронировано только ${successCount} из ${seatsToBook.length}`, "error");
        loadData();
        btn.disabled = false;
        btn.innerText = 'Оплатить билеты';
    } else {
        showNotification("Ошибка при проведении оплаты", "error");
        btn.disabled = false;
        btn.innerText = 'Оплатить билеты';
    }
};

        loadData();
    </script>
</body>
</html>
